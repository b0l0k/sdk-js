name: "sdk-js"

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/sdk.yml"
      - "package.json"
      - "bun.lockb"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/sdk.yml"
      - "package.json"
      - "bun.lockb"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "setup:bun"
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.1.38"
      - name: "install-deps"
        run: bun install --frozen-lockfile
      - name: "lint"
        run: bun run lint
      - name: "build"
        run: bun run build
